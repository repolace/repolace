[project]
name = "repolace-worker"
version = "0.0.1"
description = "Celery worker and sandbox execution logic for repolace"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.4",
    "docker>=7.1",
    "repolace-shared",
]

[tool.uv.sources]
repolace-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
