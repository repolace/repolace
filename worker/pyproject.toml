[project]
name = "repolace-worker"
version = "0.0.1"
description = "Celery worker and sandbox execution logic for repolace"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.4",
    "docker>=7.1",
    "repolace-shared",
    "repolace-pipeline",
    "repolace-rag",
    "sqlalchemy[asyncio]>=2.0",
    "pydantic-settings>=2.5",
    "structlog>=24.1",
]

[tool.uv.sources]
repolace-shared = { workspace = true }
repolace-pipeline = { workspace = true }
repolace-rag = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["repolace_worker"]
