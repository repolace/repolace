[project]
name = "repolace-api"
version = "0.0.1"
description = "FastAPI orchestrator for repolace"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "alembic>=1.13",
    "repolace-shared",
]

[tool.uv.sources]
repolace-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
