{# 16x16 line icons, decorative: the word next to each one carries the meaning. #}
{% macro icon(name, cls="") %}<svg class="i {{ cls }}" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
{% if name == "queued" %}<circle cx="8" cy="8" r="5.5" stroke-dasharray="2.4 2.2"/>
{% elif name == "running" %}<g class="spin"><circle cx="8" cy="8" r="5.5" opacity=".25"/><path d="M8 2.5a5.5 5.5 0 0 1 5.5 5.5"/></g>
{% elif name == "pr_opened" %}<circle cx="4.5" cy="3.5" r="1.7"/><circle cx="4.5" cy="12.5" r="1.7"/><circle cx="11.5" cy="12.5" r="1.7"/><path d="M4.5 5.2v5.6M11.5 10.8V7a2 2 0 0 0-2-2H8"/>
{% elif name == "completed" %}<circle cx="8" cy="8" r="5.5"/><rect x="6" y="6" width="4" height="4" rx=".5"/>
{% elif name == "conflicting" %}<path d="M8 2.2 14.2 13H1.8z"/><path d="M8 6.5v3M8 11.3h.01"/>
{% elif name == "failed" or name == "circle-x" %}<circle cx="8" cy="8" r="5.5"/><path d="M5.8 5.8l4.4 4.4M10.2 5.8l-4.4 4.4"/>
{% elif name == "circle-check" %}<circle cx="8" cy="8" r="5.5"/><path d="M5.3 8.2l2 2 3.6-4"/>
{% elif name == "circle-dashed" %}<circle cx="8" cy="8" r="5.5" stroke-dasharray="2.4 2.2"/>
{% elif name == "circle-slash" %}<circle cx="8" cy="8" r="5.5"/><path d="M4.1 11.9l7.8-7.8"/>
{% elif name == "check" %}<path d="M3.5 8.5l3 3 6-7"/>
{% elif name == "x" %}<path d="M4 4l8 8M12 4l-8 8"/>
{% elif name == "pencil" %}<path d="M10.5 2.5l3 3-8 8H2.5v-3z"/>
{% elif name == "dash" %}<path d="M4 8h8"/>
{% elif name == "clock" %}<circle cx="8" cy="8" r="5.5"/><path d="M8 4.8V8l2.2 1.4"/>
{% elif name == "triangle" %}<path d="M8 2.2 14.2 13H1.8z"/><path d="M8 6.5v3M8 11.3h.01"/>
{% elif name == "branch" %}<circle cx="4.5" cy="3.5" r="1.7"/><circle cx="4.5" cy="12.5" r="1.7"/><circle cx="11.5" cy="5.5" r="1.7"/><path d="M4.5 5.2v5.6M11.5 7.2c0 2.5-3 2.8-7 3.6"/>
{% elif name == "chevron" %}<path d="M6 3.5l4.5 4.5L6 12.5"/>
{% elif name == "arrow-left" %}<path d="M13 8H3M7 4L3 8l4 4"/>
{% elif name == "arrow-right" %}<path d="M3 8h10M9 4l4 4-4 4"/>
{% elif name == "plus" %}<path d="M8 3v10M3 8h10"/>
{% elif name == "logo" %}<rect x="2" y="2" width="12" height="12" rx="3"/><path d="M5.5 10.5v-5l5 5v-5"/>
{% endif %}
</svg>{% endmacro %}
