[project]
name = "repolace-agents"
version = "0.0.1"
description = "LangGraph graph definitions and prompts for repolace"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "repolace-shared",
    "repolace-gateway",
    "repolace-verify",
]

[tool.uv.sources]
repolace-shared = { workspace = true }
repolace-gateway = { workspace = true }
repolace-verify = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["repolace_agents"]
