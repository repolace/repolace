name: repolace

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-repolace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repolace}
      POSTGRES_DB: ${POSTGRES_DB:-repolace}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-repolace}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-repolace}"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-repolace}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-repolace}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-repolace}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-repolace}:${POSTGRES_PASSWORD:-repolace}@postgres:5432/${POSTGRES_DB:-repolace}
      REDIS_URL: redis://:${REDIS_PASSWORD:-repolace}@redis:6379/0
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-repolace}:${RABBITMQ_PASSWORD:-repolace}@rabbitmq:5672//
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-repolace}:${POSTGRES_PASSWORD:-repolace}@postgres:5432/${POSTGRES_DB:-repolace}
      REDIS_URL: redis://:${REDIS_PASSWORD:-repolace}@redis:6379/0
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-repolace}:${RABBITMQ_PASSWORD:-repolace}@rabbitmq:5672//
    healthcheck:
      test: ["CMD-SHELL", "uv run --project worker celery -A repolace_worker.celery_app inspect ping || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
