# Broker settings for the `rabbitmq` service, mounted as conf.d/20-repolace.conf so the image's
# own defaults (10-defaults.conf) still apply.
#
# consumer_timeout: how long the broker lets a delivery stay unacknowledged before it closes the
# channel. RabbitMQ's default is 30 minutes. Our tasks are `acks_late`, so a delivery stays
# unacked for the whole run of a task, which is bounded at about 3 h 15 min (task_bound_seconds
# 11,700) plus a 600 s hard-kill grace. With the default, the broker would close the worker's
# channel mid-task, the message would be redelivered, and the task would be dropped as not
# claimable while the first run is still going.
#
# The value is (task_time_limit + CONSUMER_TIMEOUT_MARGIN_SECONDS) * 1000 =
# (12,300 + 1,800) * 1000. The source of truth is
# worker/repolace_worker/tasks.py::required_consumer_timeout_ms; a test in
# worker/tests/test_worker_deploy_config.py fails if this number falls below it. If you raise
# WORKER_TASK_BOUND_SECONDS, raise this too.
#
# To confirm a running broker picked it up:
#   docker compose exec rabbitmq rabbitmqctl eval 'application:get_env(rabbit, consumer_timeout).'
consumer_timeout = 14100000
