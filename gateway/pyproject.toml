[project]
name = "repolace-gateway"
version = "0.0.1"
description = "LiteLLM wrapper for model routing and cost tracking"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.50",
    "repolace-shared",
    "sqlalchemy[asyncio]>=2.0",
    "pydantic-settings>=2.5",
    "structlog>=24.1",
]

[tool.uv.sources]
repolace-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["repolace_gateway"]
