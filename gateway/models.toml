# Stage -> model routing for the LLM gateway. Loaded by repolace_gateway.config.
#
# Provider API keys do NOT go here -- they come from the environment
# (ANTHROPIC_API_KEY, OPENAI_API_KEY, GEMINI_API_KEY) or the repo-root .env.
#
# Prices: LiteLLM's own price map is used unless a model has a [price] table.
# The map is pinned to the installed LiteLLM version (LITELLM_LOCAL_MODEL_COST_MAP)
# so a task's cost does not drift with whatever the upstream map says today.
# A model that has neither is rejected BEFORE its first call -- an unpriced call
# is a hard error, never zero. Rates are USD per MILLION tokens. If a model sets
# supports_prompt_caching, its [price] must also give cache_read and cache_write.

[gateway]
max_attempts = 5            # total tries per model, the first included
base_delay_seconds = 2.0    # backoff doubles from here, with jitter
max_delay_seconds = 60.0
request_timeout_seconds = 180.0

[stages.agent]
model = "claude-sonnet-5-5"
# fallback = "..."          # optional; used only after a transient failure exhausts retries
cache = true                # the agent loop re-sends a long, mostly stable prefix every step
max_tokens = 8192

# The merge-conflict resolver (agents/repolace_agents/resolver.py). Optional: without this table
# the stage follows `agent`. It is its own stage so its calls are tagged `resolve` in llm_calls
# and it can be pointed at another model without touching the agent's.
[stages.resolve]
model = "claude-sonnet-5-5"
cache = true
max_tokens = 8192

[stages.cheap]
model = "claude-haiku-4-5-20251001"
cache = false               # single-shot calls: a cache write costs more than it saves
max_tokens = 1024

# --- headline model --------------------------------------------------------
# LiteLLM 1.98.0's price map has `claude-sonnet-5` but no `claude-sonnet-5-5`,
# so the price is set explicitly below. Rates were deliberately not guessed:
# a wrong price here is a wrong benchmark.
[models.claude-sonnet-5-5]
provider = "anthropic"
litellm_model = "anthropic/claude-sonnet-5-5"
supports_prompt_caching = true
[models.claude-sonnet-5-5.price]
# From Anthropic's pricing page, supplied by the maintainer 2026-10-05.
# cache_write is the 5-minute rate: the gateway sends cache_control without a ttl.
input = 2.00
output = 10.00
cache_read = 0.20
cache_write = 2.50

# --- the headline model, through Amazon Bedrock ----------------------------
# Same model as `claude-sonnet-5-5`, called through Bedrock's global cross-region inference
# profile, authenticated by an AWS profile (GATEWAY_AWS_PROFILE) and region
# (GATEWAY_AWS_REGION) instead of an API key. Select it per sweep with
#   GATEWAY_STAGE_MODELS='{"agent": "claude-sonnet-5-5-bedrock"}'
# or `repolace-eval enqueue/run --model claude-sonnet-5-5-bedrock`. A Bedrock run is a separate
# model in the benchmark report: never mix it with the direct-API model in one sweep.
#
# Priced from AWS's own rate card for this model's Marketplace offer
# (`aws bedrock list-foundation-model-agreement-offers`, offer-5fu2rhus3byrs, read 2026-10-06):
# the "Standard, Global" dimensions, which is what the `global.` profile is billed at. They equal
# the direct API's rates. The regional ("Standard") dimensions are about 10% higher, so do NOT
# reuse this entry for a `us.`, `eu.` or `in.` profile: that would be a different route with
# a different price. cache_write is the 5-minute rate, because the gateway sends cache_control
# without a ttl (the 1-hour rate is $4.00).
[models.claude-sonnet-5-5-bedrock]
provider = "bedrock"
litellm_model = "bedrock/global.anthropic.claude-sonnet-5-5"
supports_prompt_caching = true

[models.claude-sonnet-5-5-bedrock.price]
input = 2.00
output = 10.00
cache_read = 0.20
cache_write = 2.50

# --- cheap model -----------------------------------------------------------
[models.claude-haiku-4-5-20251001]
provider = "anthropic"
litellm_model = "anthropic/claude-haiku-4-5-20251001"
supports_prompt_caching = true   # priced by LiteLLM's map; no [price] needed

