[project]
name = "repolace-shared"
version = "0.0.1"
description = "Shared task schemas and common types for repolace services"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic-settings>=2.5",
    "structlog>=24.1",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["repolace_shared"]
