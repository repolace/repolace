[project]
name = "repolace-eval"
version = "0.0.1"
description = "SWE-bench-style benchmark harness for repolace"
requires-python = ">=3.12"
dependencies = [
    "repolace-shared",
    "repolace-verify",
    # Imported lazily by `enqueue.code_limits()` to read the agent's and the gateway's
    # default limits into the run manifest; declared so that is not an accident of the workspace.
    "repolace-agents",
    "repolace-gateway",
    # Imported lazily, and by exactly one module (the retrieval eval): it pulls
    # torch, which nothing else in the harness should pay for.
    "repolace-rag",
    "sqlalchemy[asyncio]>=2.0",
    "httpx>=0.27",
    "structlog>=24.1",
]

[project.scripts]
repolace-eval = "harness.cli:main"

[tool.uv.sources]
repolace-shared = { workspace = true }
repolace-verify = { workspace = true }
repolace-agents = { workspace = true }
repolace-gateway = { workspace = true }
repolace-rag = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]
