[project]
name = "repolace-eval"
version = "0.0.1"
description = "SWE-bench-style benchmark harness for repolace"
requires-python = ">=3.12"
dependencies = [
    "repolace-shared",
]

[tool.uv.sources]
repolace-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]
