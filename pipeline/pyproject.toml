[project]
name = "repolace-pipeline"
version = "0.0.1"
description = "The Phase 1 task pipeline: clone, index, retrieve, edit, push, open a PR"
requires-python = ">=3.12"
dependencies = [
    "repolace-shared",
    "repolace-rag",
    "repolace-verify",
    "repolace-agents",
    "repolace-gateway",
    "sqlalchemy[asyncio]>=2.0",
    "httpx>=0.27",
    "pydantic-settings>=2.5",
    "structlog>=24.1",
]

[project.scripts]
repolace-run-task = "repolace_pipeline.cli:main"

[tool.uv.sources]
repolace-shared = { workspace = true }
repolace-rag = { workspace = true }
repolace-verify = { workspace = true }
repolace-agents = { workspace = true }
repolace-gateway = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["repolace_pipeline"]
