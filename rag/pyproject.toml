[project]
name = "repolace-rag"
version = "0.0.1"
description = "Repo-aware retrieval: AST chunking, embedding, pgvector indexing, hybrid retrieval"
requires-python = ">=3.12"
dependencies = [
    "repolace-shared",
]

[tool.uv.sources]
repolace-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["retrieval"]
