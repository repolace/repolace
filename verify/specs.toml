# Per-repository overrides for the Verify sandbox.
#
# A repository with no entry here gets `RepoSpec` defaults plus the install
# heuristic in `verify/verify/spec.py`, which is the state every repository
# starts in. Add an entry when the heuristic gets it wrong -- that is the
# fiddly, per-repo cost CLAUDE.md warns is "the part that will actually cost
# the time", and this file is where it accumulates one repo at a time.
#
# Unknown fields are refused rather than ignored: a typo that silently stopped
# applying would surface weeks later as an unexplained unscoreable run.
#
# [specs."owner/name"]
# base_image = "python:3.11-slim"
# system_packages = ["libpq-dev", "gcc"]
# install = ["pip install -e '.[test]'", "pip install pytest"]
# test_targets = ["tests"]
# timeout_seconds = 900
# keep_addopts = false
# disable_plugin_autoload = false
