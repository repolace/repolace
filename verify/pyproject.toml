[project]
name = "repolace-verify"
version = "0.0.1"
description = "Runs a target repo's test suite in a sandbox and scores the result"
requires-python = ">=3.12"
dependencies = [
    "repolace-shared",
    "structlog>=24.1",
]

[tool.uv.sources]
repolace-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verify"]
