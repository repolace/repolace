[project]
name = "repolace"
version = "0.0.1"
description = "Autonomous software-engineering agent platform"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["api", "worker", "agents", "gateway", "rag", "shared", "eval"]

[tool.pytest.ini_options]
testpaths = ["rag/tests", "shared/tests"]
addopts = "-q"
